[project]
name = "sistrix-weekly-worker"
version = "0.1.0"
description = "Mistral Workflows worker: weekly Sistrix SEO competitor analysis with PDF report"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=0.1",
    "pydantic>=2",
    "reportlab>=4",
    "requests>=2.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
